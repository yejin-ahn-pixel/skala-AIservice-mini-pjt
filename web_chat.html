<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>운영 에이전트 채팅 (Vue)</title>
<!--
  [C14] 프론트엔드 개선 (이 파일만 수정, 서버 코드는 그대로)

  Before (원본 + C13)
    - 대화가 하나뿐이라 새 대화를 시작하려면 서버 재시작/새로고침이 필요했다.
      (새로고침하면 화면 기록도 사라지고, thread_id도 새로 만들어졌다)
    - 응답을 기다리는 동안 "지금 어디까지 왔는지/얼마나 걸렸는지"를 알 수 없었다.
    - 보낸 요청을 취소할 수 없었다.
    - 단계 목록이 전부 ⏳였다. (CSS에 .done 스타일은 있었지만 done 클래스를 붙이는 코드가 없었다)
    - 검수 전 초안이 최종 답변과 똑같은 말풍선으로 나타나, 반려된 초안도 그대로 남았다.

  After
    - 왼쪽 대화 목록 + "새 대화": 대화마다 thread_id가 다르고, 기록은 브라우저(localStorage)에 저장된다.
      (서버가 thread_id별로 이전 대화를 기억하므로 서버 수정 없이 동작한다)
    - 경과 시간, 단계별 소요 시간, "진행 중" 줄 (오래 걸리는 단계에는 안내 문구).
    - "중단" 버튼: 스트림 연결을 끊는다. (화면 쪽만 중단. 서버가 이미 시작한 모델 호출은 끝까지 돌 수 있다)
    - 끝난 단계는 ✓, 진행 중인 단계는 회전 표시.
    - 초안은 "작성 중" 흐린 말풍선, 검수 통과하면 확정, 반려되면 접힌 "반려된 초안" 으로 숨긴다.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #16161f;        /* 전체 배경 */
    --panel: #1d1d2a;     /* 사이드바·입력창 */
    --card: #262637;      /* 말풍선·카드 */
    --line: #34344a;      /* 경계선 */
    --text: #e8e8f4;
    --muted: #a3a3c2;     /* 보조 글자 (배경 대비 AA 이상) */
    --accent: #5b5bd6;    /* 포인트 색은 이것 하나만 사용 */
    --ok: #7ee787;
    --warn: #f0b429;
    --bad: #ff7b72;
    --radius: 12px;       /* 모서리 반경 통일 */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  button { font-family: inherit; }
  #app { height: 100%; display: flex; }

  /* ---------- 사이드바 ---------- */
  .sidebar {
    width: 270px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head { padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .brand { font-weight: 600; font-size: 15px; }
  .new {
    padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line);
    background: transparent; color: var(--text); font-size: 14px; cursor: pointer; text-align: left;
  }
  .new:hover { background: var(--card); }
  .convos { list-style: none; margin: 0; padding: 4px 8px; overflow-y: auto; flex: 1; min-height: 0; }
  .convos li {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; color: var(--muted);
  }
  .convos li:hover { background: var(--card); color: var(--text); }
  .convos li.active { background: var(--card); color: var(--text); }
  .convos .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convos .del {
    border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px;
    line-height: 1; padding: 2px 6px; border-radius: 6px; opacity: 0;
  }
  .convos li:hover .del, .convos li.active .del { opacity: 1; }
  .convos .del:hover { color: var(--bad); }
  .run-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
  .side-foot { padding: 12px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.5; }

  /* ---------- 본문 ---------- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 12px; min-height: 52px;
  }
  .menu {
    display: none; border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 8px; padding: 4px 9px; font-size: 16px; cursor: pointer;
  }
  .h-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px; }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  .inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .row.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: var(--card); border-bottom-left-radius: 4px; }
  /* 검수 전 초안: 흐리게 + 작은 라벨 */
  .row.agent.draft .bubble { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .draft-label { display: block; font-size: 12px; color: var(--warn); margin-bottom: 4px; }
  .notice { align-self: center; font-size: 12px; color: var(--muted); }

  .rejected { max-width: 82%; border: 1px solid var(--line); border-radius: var(--radius); font-size: 12px; color: var(--muted); }
  .rejected summary { cursor: pointer; padding: 8px 12px; list-style: none; }
  .rejected summary::-webkit-details-marker { display: none; }
  .rejected summary::before { content: "▸ "; }
  .rejected[open] summary::before { content: "▾ "; }
  .rejected .rej-text { padding: 4px 12px 12px; white-space: pre-wrap; line-height: 1.6; }

  /* ---------- 진행 상황 카드 ---------- */
  .steps {
    max-width: 82%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; font-size: 13px;
  }
  .steps-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; list-style: none; }
  .steps-head::-webkit-details-marker { display: none; }
  .steps-head::before { content: ""; border: solid currentColor; border-width: 0 1px 1px 0; padding: 3px; transform: rotate(-45deg); }
  .steps[open] .steps-head::before { transform: rotate(45deg); }
  .steps-body { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .steps-title { font-weight: 600; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .steps.running .chip { color: var(--warn); border-color: var(--warn); }
  .steps.done .chip { color: var(--ok); border-color: var(--ok); }
  .steps.has-failure .chip { color: var(--bad); border-color: var(--bad); }
  .steps.cancelled .chip, .steps.error .chip { color: var(--bad); border-color: var(--bad); }
  .step { display: flex; align-items: baseline; gap: 8px; color: var(--muted); }
  .step.failed, .step.failed .mark { color: var(--bad); }
  .step .mark { width: 14px; flex-shrink: 0; color: var(--ok); }
  .step .label { flex: 1; }
  .step .dur { font-size: 12px; font-variant-numeric: tabular-nums; }
  .step.active { color: var(--text); }
  .spin {
    width: 10px; height: 10px; margin: 0 2px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid var(--warn); border-top-color: transparent; align-self: center;
  }
  @media (prefers-reduced-motion: no-preference) {
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  }

  .prompt-box {
    flex-shrink: 0; max-width: 82%; background: #11111a; border: 1px solid var(--line);
    border-radius: var(--radius); font-size: 12px; overflow: hidden;
  }
  .prompt-box summary { cursor: pointer; padding: 8px 12px; color: var(--muted); user-select: none; list-style: none; }
  .prompt-box summary::-webkit-details-marker { display: none; }
  .prompt-box summary::before { content: "▸ "; }
  .prompt-box[open] summary::before { content: "▾ "; }
  .prompt-box pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); color: #c3c3e0;
    white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow-y: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* ---------- 빈 화면 ---------- */
  .empty { text-align: center; padding: 48px 0 8px; }
  .empty h2 { margin: 0 0 6px; font-size: 20px; }
  .empty p { margin: 0 0 22px; color: var(--muted); }
  .examples { display: flex; flex-direction: column; gap: 8px; max-width: 520px; margin: 0 auto; }
  .examples button {
    text-align: left; padding: 11px 14px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 14px; cursor: pointer;
  }
  .examples button:hover { border-color: var(--accent); }
  .examples small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* ---------- 입력창 ---------- */
  form { padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--line); }
  .composer { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; }
  input {
    flex: 1; padding: 11px 14px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .send, .stop {
    padding: 11px 20px; border-radius: var(--radius); border: none; color: #fff; font-size: 14px; cursor: pointer;
  }
  .send { background: var(--accent); }
  .send:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .stop { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
  .stop:hover { background: rgba(255, 123, 114, 0.12); }

  .scrim { display: none; }
  @media (max-width: 760px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; }
    .sidebar-open .sidebar { transform: none; }
    .sidebar-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 10; }
    .menu { display: block; }
    .bubble, .steps, .prompt-box, .rejected { max-width: 100%; }
  }
</style>
</head>
<body>
<div id="app" :class="{ 'sidebar-open': sidebarOpen }">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand">운영 인시던트 에이전트</div>
      <button class="new" type="button" @click="newChat">＋ 새 대화</button>
    </div>
    <ul class="convos">
      <li v-for="c in convos" :key="c.id" :class="{ active: c.id === activeId }" @click="select(c.id)">
        <span v-if="c.running" class="run-dot" title="진행 중"></span>
        <span class="title">{{ c.title }}</span>
        <button class="del" type="button" aria-label="대화 삭제" @click.stop="removeChat(c.id)">×</button>
      </li>
    </ul>
    <div class="side-foot">{{ backendLabel }}</div>
  </aside>
  <div class="scrim" @click="sidebarOpen = false"></div>

  <main>
    <header>
      <button class="menu" type="button" aria-label="대화 목록 열기" @click="sidebarOpen = true">☰</button>
      <div class="h-title">{{ active.title }}</div>
    </header>

    <div id="log" ref="logEl">
      <div class="inner">
        <div v-if="!active.log.length" class="empty">
          <h2>무엇을 확인할까요?</h2>
          <p>시스템 이름과 증상을 함께 적으면 가장 정확해요.</p>
          <div class="examples">
            <button v-for="ex in examples" :key="ex.text" type="button" @click="sendText(ex.text)">
              {{ ex.text }}<small>{{ ex.note }}</small>
            </button>
          </div>
        </div>

        <template v-for="item in active.log" :key="item.id">
          <div v-if="item.kind === 'user'" class="row user">
            <div class="bubble">{{ item.text }}</div>
          </div>

          <details v-else-if="item.kind === 'steps'" class="steps" :class="[item.state, { 'has-failure': item.steps.some(s => s.failed) }]" :open="item.state === 'running'">
            <summary class="steps-head">
              <span class="steps-title">진행 상황</span>
              <span class="chip">{{ stateText(item) }}</span>
            </summary>
            <div class="steps-body">
              <div v-for="(s, i) in item.steps" :key="i" class="step" :class="{ failed: s.failed }">
                <span class="mark">{{ s.failed ? '!' : '✓' }}</span>
                <span class="label">{{ s.label }}</span>
                <span class="dur">{{ stepDur(item, i) }}</span>
              </div>
              <div v-if="item.state === 'running'" class="step active">
                <span class="spin"></span>
                <span class="label">{{ activeLabel(item) }}</span>
                <span class="dur">{{ liveDur(item) }}</span>
              </div>
            </div>
          </details>

          <div v-else-if="item.kind === 'agent'" class="row agent" :class="{ draft: item.draft }">
            <div class="bubble"><span v-if="item.draft" class="draft-label">작성 중 · 검수 전</span>{{ item.text }}</div>
          </div>

          <details v-else-if="item.kind === 'rejected'" class="rejected">
            <summary>검수에서 반려된 초안 (시도 {{ item.attempt }}) 보기</summary>
            <div class="rej-text">{{ item.text }}</div>
          </details>

          <div v-else-if="item.kind === 'notice'" class="notice">{{ item.text }}</div>

          <details v-else-if="item.kind === 'prompt'" class="prompt-box">
            <summary>LLM에 전달된 최종 프롬프트 보기</summary>
            <pre>{{ item.text }}</pre>
          </details>
        </template>
      </div>
    </div>

    <form @submit.prevent="onSubmit">
      <div class="composer">
        <input v-model="input" autocomplete="off" aria-label="메시지 입력"
               placeholder="예: auth-service 로그인 응답이 느려졌어요. 원인 확인해주세요" />
        <button v-if="!active.running" class="send" type="submit" :disabled="!input.trim()">보내기</button>
        <button v-else class="stop" type="button" @click="stopChat(active)">중단</button>
      </div>
    </form>
  </main>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, computed, watch, nextTick, onMounted } = Vue;

// 서버가 보내는 이벤트(type)를 사용자가 읽을 문장으로 바꾸는 표. null을 돌려주면 단계로 표시하지 않는다.
const STEP_LABELS = {
  RouteDecided: e => e.route ? `질문 분류: ${e.route === 'incident' ? '장애 대응' : e.route === 'chat' ? '일반 대화' : e.route}` : null,
  PlanCreated: e => `계획 수립: 할 일 ${e.task_count}가지${e.targets?.length ? ` (시스템: ${e.targets.join(', ')})` : ''}`,
  GateApplied: e => e.removed_analysis_tasks ? `불필요한 작업 ${e.removed_analysis_tasks}건 제거` : null,
  TaskCompleted: e => (e.source === 'monitoring'
      ? `모니터링 지표 확인 (시스템: ${e.target})`
      : `대응 매뉴얼(runbook) 조회 (장애유형: ${e.target})`) + (e.retries ? ' (재시도 성공)' : ''),
  TaskFailed: e => e.source === 'monitoring'
      ? `모니터링 조회 실패 (시스템: ${e.target})`
      : `대응 매뉴얼 조회 실패 (장애유형: ${e.target})`,
  ReplanCheck: e => e.is_sufficient ? null : `정보 부족 → 장애유형 "${e.target}"로 추가 조사`,
  ClarifyAsked: () => '대상 시스템을 알 수 없어 되묻기',
  DraftWritten: e => `답변 초안 작성 (시도 ${e.attempt})`,
  Validation: e => e.verdict === '합격' ? '검수 통과' : '검수 반려 → 다시 작성',
  Finalize: () => '최종 답변 완성',
};

const EXAMPLES = [
  { text: 'payments-service 결제 응답이 느려지고 CPU가 치솟았어요', note: '시스템 + 증상 (정상 조사 경로)' },
  { text: 'web-01 상태 진단해줘', note: '정상 시스템 확인' },
  { text: '로그인이 너무 느려요', note: '시스템 미지정 → 되묻기' },
  { text: 'billing-service 응답이 느려요', note: '등록되지 않은 시스템 → 조회 불가 안내' },
];

const STORE_KEY = 'opsagent.convos.v1';
const MAX_CONVOS = 30;

function newThreadId() { return 't-web-' + Math.random().toString(36).slice(2, 8); }
function makeConvo() { return { id: newThreadId(), title: '새 대화', log: [], running: false }; }

// 브라우저 저장소는 막혀 있을 수 있으므로(시크릿 창 등) 항상 try/catch로 감싸고, 실패해도 화면은 동작한다.
function loadConvos() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return [];
    const list = JSON.parse(raw);
    if (!Array.isArray(list)) return [];
    list.forEach(c => {
      c.running = false;   // 새로고침 시 진행 중이던 스트림은 이미 끊겼다
      c.log.forEach(it => {
        if (it.kind === 'steps' && it.state === 'running') { it.state = 'cancelled'; it.endedAt = it.endedAt || Date.now(); }
      });
    });
    return list;
  } catch { return []; }
}
function saveConvos(list) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(0, MAX_CONVOS))); } catch { /* 저장 실패는 무시 */ }
}

createApp({
  setup() {
    const backendLabel = ref('all_total_vue');
    const convos = ref(loadConvos());
    if (!convos.value.length) convos.value.push(makeConvo());
    const activeId = ref(convos.value[0].id);
    const input = ref('');
    const logEl = ref(null);
    const sidebarOpen = ref(false);
    const now = ref(Date.now());   // 경과 시간 표시용 시계 (0.5초마다 갱신)
    const streams = new Map();     // thread_id → EventSource (화면 갱신과 무관하므로 reactive로 만들지 않는다)
    let nextId = Date.now();       // 말풍선 key용 번호 (저장된 기록과 겹치지 않게 시간으로 시작)

    const active = computed(() => convos.value.find(c => c.id === activeId.value) || convos.value[0]);

    fetch('/health').then(r => r.json()).then(h => {
      backendLabel.value = `${h.llm_backend} 실모델(${h.fast_llm}/${h.quality_llm})`;
    }).catch(() => {});

    setInterval(() => { now.value = Date.now(); }, 500);

    // 대화가 바뀔 때마다 저장 (토큰이 계속 들어오므로 0.4초 모아서 한 번만)
    let saveTimer = null;
    watch(convos, () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveConvos(convos.value), 400);
    }, { deep: true });

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    // ---------- 시간 표시 ----------
    function human(ms) {
      const s = Math.max(0, Math.round(ms / 1000));
      return s < 60 ? `${s}초` : `${Math.floor(s / 60)}분 ${s % 60}초`;
    }
    function stateText(item) {
      const failures = item.steps.filter(s => s.failed).length;
      const failureText = failures ? ` · 조회 실패 ${failures}건` : '';
      if (item.state === 'running') return `진행 중 · 경과 ${human(now.value - item.startedAt)}${failureText}`;
      const total = human((item.endedAt || item.startedAt) - item.startedAt);
      if (item.state === 'done') return `완료 · 총 ${total}${failureText}`;
      if (item.state === 'cancelled') return `중단됨 · ${total}${failureText}`;
      return `오류 · ${total}${failureText}`;
    }
    function stepDur(item, i) {   // 이 단계에 걸린 시간 = 이번 이벤트 시각 − 직전 이벤트 시각
      const prev = i === 0 ? 0 : item.steps[i - 1].t;
      return ((item.steps[i].t - prev) / 1000).toFixed(1) + 's';
    }
    function sinceLast(item) {
      const last = item.steps.length ? item.steps[item.steps.length - 1].t : 0;
      return now.value - item.startedAt - last;
    }
    function liveDur(item) { return Math.round(sinceLast(item) / 1000) + 's'; }
    function activeLabel(item) {
      if (sinceLast(item) > 15000) return '모델이 답변을 만드는 중… (로컬 모델은 수십 초 걸릴 수 있어요)';
      return item.steps.length ? '다음 단계 진행 중…' : '요청을 처리하는 중…';
    }

    // ---------- 대화 목록 ----------
    function newChat() {
      const empty = convos.value.find(c => !c.log.length && !c.running);
      if (empty) { activeId.value = empty.id; }   // 이미 빈 대화가 있으면 그걸 재사용
      else { const c = makeConvo(); convos.value.unshift(c); activeId.value = c.id; }
      sidebarOpen.value = false;
    }
    function select(id) { activeId.value = id; sidebarOpen.value = false; scrollToBottom(); }
    function removeChat(id) {
      const c = convos.value.find(x => x.id === id);
      if (c && c.running) stopChat(c);
      convos.value = convos.value.filter(x => x.id !== id);
      if (!convos.value.length) convos.value.push(makeConvo());
      if (activeId.value === id) activeId.value = convos.value[0].id;
    }

    // ---------- 전송 / 중단 ----------
    function onSubmit() { sendText(input.value); }

    function stopChat(c) {
      const es = streams.get(c.id);
      if (es) { es.close(); streams.delete(c.id); }
      const stepsItem = [...c.log].reverse().find(it => it.kind === 'steps');
      if (stepsItem && stepsItem.state === 'running') { stepsItem.state = 'cancelled'; stepsItem.endedAt = Date.now(); }
      c.log = c.log.filter(it => !(it.kind === 'agent' && it.draft));   // 완성되지 않은 초안은 지운다
      c.running = false;
      c.log.push({ id: nextId++, kind: 'notice', text: '요청을 중단했어요. (서버가 이미 시작한 모델 호출은 끝까지 진행될 수 있어요)' });
      if (c.id === activeId.value) scrollToBottom();
    }

    function sendText(raw) {
      const text = (raw || '').trim();
      const c = active.value;
      if (!text || c.running) return;
      input.value = '';

      if (c.title === '새 대화') c.title = text.length > 28 ? text.slice(0, 28) + '…' : text;
      c.log.push({ id: nextId++, kind: 'user', text });
      c.running = true;

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [], state: 'running', startedAt: Date.now(), endedAt: 0 });
      c.log.push(stepsItem);
      scrollToBottom();

      const show = () => { if (c.id === activeId.value) scrollToBottom(); };
      const finish = (state) => {
        const es0 = streams.get(c.id);
        if (es0) { es0.close(); streams.delete(c.id); }
        if (stepsItem.state === 'running') stepsItem.state = state;
        stepsItem.endedAt = Date.now();
        c.running = false;
      };

      const url = `/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(c.id)}`;
      const es = new EventSource(url);
      streams.set(c.id, es);
      let streamItem = null;     // 지금 쓰이고 있는 초안 말풍선
      let streamAttempt = null;  // 재작성(attempt 증가) 시 새 말풍선으로 끊는다
      let hadError = false;

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { finish(hadError ? 'error' : 'done'); return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'AnswerToken') {
          if (!streamItem || streamAttempt !== e.attempt) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '', draft: true, attempt: e.attempt });
            c.log.push(streamItem);
            streamAttempt = e.attempt;
          }
          streamItem.text += e.delta;
          show();
          return;
        }

        if (e.type === 'FinalAnswer') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '', draft: false });
            c.log.push(streamItem);
          }
          streamItem.text = e.reply;   // 토큰 합산 결과와 서버의 최종 텍스트를 일치시킨다
          streamItem.draft = false;
          if (e.prompt) c.log.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null;
          streamAttempt = null;
          show();
          return;
        }

        // 서버가 보낸 오류 이벤트(C13)를 화면에 표시한다. 이어서 오는 [DONE]에서 정리한다.
        if (e.type === 'Error') {
          hadError = true;
          c.log.push({ id: nextId++, kind: 'agent', text: '⚠️ ' + (e.message || '오류가 발생했습니다.') });
          show();
          return;
        }

        // [C14] 검수 결과에 따라 초안 말풍선의 운명을 정한다.
        //   합격 → 확정(흐린 표시 제거) / 반려 → 접힌 "반려된 초안"으로 바꿔 숨긴다.
        if (e.type === 'Validation' && streamItem) {
          if (e.verdict === '합격') {
            streamItem.draft = false;   // 말풍선은 그대로 두고, 이어서 오는 FinalAnswer가 같은 말풍선을 최종 텍스트로 채운다
          } else {
            streamItem.kind = 'rejected';
            streamItem.draft = false;
            streamItem = null;          // 다음 시도는 새 말풍선에서 시작
            streamAttempt = null;
          }
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        stepsItem.steps.push({ label, t: Date.now() - stepsItem.startedAt, failed: e.type === 'TaskFailed' });
        show();
      };

      // 정상 종료([DONE])가 아닌 연결 끊김이면 사용자에게 알린다. (C13)
      es.onerror = () => {
        const wasRunning = c.running;
        finish('error');
        if (wasRunning) {
          c.log.push({ id: nextId++, kind: 'agent', text: '⚠️ 서버와 연결이 끊어졌습니다. 서버가 켜져 있는지 확인해 주세요.' });
          show();
        }
      };
    }

    return {
      backendLabel, convos, activeId, active, input, logEl, sidebarOpen, examples: EXAMPLES,
      onSubmit, sendText, stopChat, newChat, select, removeChat,
      stateText, stepDur, liveDur, activeLabel,
    };
  },
}).mount('#app');
</script>
</body>
</html>
